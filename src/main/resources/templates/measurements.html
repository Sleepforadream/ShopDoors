<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}" lang="ru">

<head>
    <title layout:fragment="title">Запись на замер</title>
</head>

<th:block layout:fragment="content">
    <script type="text/javascript" th:src="@{/js/measurementScripts.js}" defer></script>
    <div class="measurements-main">
        <div class="separator-with-shadow" style="padding-top: 0;padding-bottom: 0;margin-top: 0;">
            <div class="separator-with-shadow-box" style="margin-top: 0;"></div>
        </div>
        <th:block th:if="${error != null}">
            <div class="error-register-block">
                <p class="error-register" th:text="${error}"></p>
            </div>
        </th:block>
        <th:block th:unless="${error != null}">
            <div class="error-register-block" style="display:none;">
                <p class="error-register" th:text="${error}"></p>
            </div>
        </th:block>
        <div class="measurements-box">
            <div class="separator-with-shadow" style="margin-top: 0;">
                <div class="separator-with-shadow-box"></div>
            </div>
            <div class="measurements-title">Заполните контактные данные для выезда мастера к Вам на замер и мы свяжемся
                с Вами
            </div>
            <div class="separator-with-shadow" style="padding-top: inherit;margin-bottom: 0;background: antiquewhite;">
                <div class="separator-with-shadow-box"></div>
            </div>
            <div class="measurements-form">
                <form method="post" enctype="multipart/form-data">
                    <div class="measurements-input-line">
                        <div class="measurements-input" style="width: 32.6666%;">
                            <label> Ваше имя
                                <span class="measurements-input-name">
                                    <input type="text" name="name" th:value="${name}" size="40"
                                           class="form-control" aria-required="true" id="name"
                                           aria-invalid="false" autocomplete="name" placeholder="Введите имя">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 26%;">
                            <label> Ваша фамилия (необязательно)
                                <span class="measurements-input-second-name">
                                    <input type="text" name="secondName" th:value="${secondName}" size="40"
                                           class="form-control" aria-required="true" id="secondName"
                                           aria-invalid="false" autocomplete="secondName" placeholder="Введите фамилию">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 32.6666%;margin-right: 0;">
                            <label> Ваше отчество (необязательно)
                                <span class="measurements-input-third-name">
                                    <input type="text" name="thirdName" th:value="${thirdName}" size="40"
                                           class="form-control" aria-required="true" id="thirdName"
                                           aria-invalid="false" autocomplete="thirdName" placeholder="Введите отчество">
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="measurements-input-line">
                        <div class="measurements-input" style="width: 32.6666%;">
                            <label> Ваша электронная почта
                                <span class="measurements-input-email">
                                    <input type="email" name="email" th:value="${email}" size="40"
                                           class="form-control" aria-required="true" id="email"
                                           aria-invalid="false" autocomplete="email" placeholder="Введите электронную почту">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 26%;">
                            <label> Телефон
                                <span class="measurements-input-phone">
                                    <input type="text" name="phoneNumber" th:value="${phoneNumber}" size="40"
                                           class="form-control" aria-required="true" id="phoneNumber"
                                           aria-invalid="false" placeholder="Введите телефон">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 32.6666%;margin-right: 0;">
                            <label> Адрес
                                <span class="measurements-input-address">
                                    <input type="text" name="address" th:value="${address}" size="40"
                                           class="form-control" aria-required="true" id="address"
                                           aria-invalid="false" autocomplete="address" placeholder="Введите адрес">
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="measurements-input-line">
                        <div class="measurements-input" style="width: 46.75%;">
                            <label> Выберите город
                                <span class="measurements-input-city">
                                    <span class="measurements-select">
                                        <select class="form-control-select" aria-invalid="false" name="city" id="city"
                                                th:value="${city}">
                                            <option value="STERLITAMAK">Стерлитамак</option>
                                            <option value="SALAVAT">Салават</option>
                                            <option value="ISHIMBAY">Ишимбай</option>
                                            <option value="TOLBAZY">Толбазы</option>
                                            <option value="MELEUZ">Мелеуз</option>
                                            <option value="UFA">Уфа</option>
                                        </select>
                                        <object class="select-arrow">
                                            <div class="indicator-dropdown"></div>
                                        </object>
                                    </span>
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 46.75%;margin-right: 0;">
                            <label> Фабрика-изготовитель
                                <span class="measurements-input-fabric">
                                    <span class="measurements-select">
                                        <select class="form-control-select" aria-invalid="false" name="fabric"
                                                id="fabric" th:value="${fabric}">
                                            <option value="SOFIA">Sofia</option>
                                            <option value="KD">Краснодеревщик</option>
                                            <option value="MEZZO_PORTE">Mezzo Porte</option>
                                            <option value="SYNERGY">Synergy</option>
                                            <option value="VDK">ВДК</option>
                                            <option value="VELL_DORIS">VellDoris</option>
                                            <option value="LINE_DOOR">LineDoor</option>
                                            <option value="GUARDIAN">Гардиан</option>
                                        </select>
                                        <object class="select-arrow">
                                            <div class="indicator-dropdown"></div>
                                        </object>
                                    </span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="measurements-input-line">
                        <div class="measurements-input" style="width: 20.4%;">
                            <label> Кол-во м/к дверей
                                <span class="measurements-input-room-doors-count">
                                    <input type="number" name="roomDoorsCount" th:value="${roomDoorsCount}" size="40"
                                           class="form-control" id="roomDoorsCount" aria-required="true"
                                           aria-invalid="false" required min="0" step="1">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 20.4%;">
                            <label> Кол-во входных дверей
                                <span class="measurements-input-enter-doors-count">
                                    <input type="number" name="enterDoorsCount" th:value="${enterDoorsCount}" size="40"
                                           class="form-control" id="enterDoorsCount" aria-required="true"
                                           aria-invalid="false" required min="0" step="1">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 20.4%;">
                            <label> Дата замера
                                <span class="measurements-input-date">
                                    <input type="date" name="measurementDate" size="40" required
                                           class="form-control" id="measurementDate" aria-required="true"
                                           aria-invalid="false" th:value="${selectedDate}" min="" onchange="updateAvailableTimes(this.value)">
                                </span>
                            </label>
                        </div>
                        <div class="measurements-input" style="width: 20.4%;margin-right: 0;">
                            <label> Время замера
                                <span class="measurements-input-time">
                                    <select name="measurementTime" id="measurementTime" class="form-control" required aria-required="true" aria-invalid="false">
                                        <option th:each="time : ${availableTimes}" th:value="${time}" th:text="${time}"></option>
                                    </select>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="measurements-input-line">
                        <div class="measurements-input" style="width: 100%;margin-right:0;">
                            <label> Дополнительная информация
                                <span class="measurements-input-info">
                                    <textarea style="height: 200px;" name="info" id="info" th:value="${info}"
                                              class="form-control" aria-required="true" aria-invalid="false">
                                    </textarea>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="measurements-input-line" style="padding-bottom: 3%;">
                        <button class="button-enter-user submit-sample" style="margin-right: 10px;" type="submit"
                                name="confirmMeasurementButton"
                                id="confirmMeasurementButton">
                            Записаться на замер
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
